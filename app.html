<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة جوده | لوحة الطالب</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f8fc;--bg2:#fff;--card:#fff;--line:#d9e4f0;--tx:#0c1b2e;--mut:#5b6e86;--ac:#0b8fe0;--ac2:#0a6fb8;--gold:#e0a21b;--ok:#13b47f;--bad:#e0405e;--glow:rgba(11,143,224,.16)}
[data-theme=dark]{--bg:#0a1228;--bg2:#0e1a35;--card:#131f3d;--line:#22345c;--tx:#eef4fb;--mut:#8da0bd;--ac:#18a4f2;--ac2:#0b86cf;--gold:#f2b632;--ok:#19cf93;--bad:#f0506e;--glow:rgba(24,164,242,.2)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Readex Pro',Tahoma,sans-serif;background:var(--bg);color:var(--tx);line-height:1.8;min-height:100vh}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.wrap{max-width:1180px;margin:auto;padding:0 20px}
.top{position:sticky;top:0;z-index:20;background:var(--bg2);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;height:64px}
.logo{display:flex;gap:10px;align-items:center;font-weight:700}
.logo i{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-style:normal}
.row{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;background:var(--ac);color:#fff;padding:10px 22px;border-radius:13px;font-weight:700;transition:.2s}
.btn:hover{background:var(--ac2)}.btn.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}.btn.ok{background:var(--ok)}.btn[disabled]{opacity:.45;cursor:default}
.ib{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}
.mut{color:var(--mut)}
main{padding:34px 0 60px}
h2{font-size:1.6rem;margin-bottom:6px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .4s}
.grid{display:grid;gap:20px}.g3{grid-template-columns:repeat(3,1fr)}
.stat b{display:block;font-size:2rem;color:var(--gold)}
/* login */
.login{max-width:420px;margin:70px auto;text-align:center}
.login input{width:100%;margin:18px 0 14px;padding:13px 16px;border-radius:13px;border:1px solid var(--line);background:var(--bg);text-align:right}
/* dashboard course */
.cc{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.cc .th{width:200px;aspect-ratio:16/9;border-radius:16px;background:linear-gradient(135deg,#0b5fa8,#18a4f2);color:#fff;display:grid;place-items:center;font-size:1.5rem;font-weight:700;text-align:center;padding:10px}
.cc>div:nth-child(2){flex:1;min-width:220px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:10px;text-align:right;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500}
/* course */
.cl{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start}
.player{aspect-ratio:16/9;border-radius:18px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;text-align:center;overflow:hidden}
.player video{width:100%;height:100%}
.play{width:70px;height:70px;border-radius:50%;background:var(--ac);color:#fff;font-size:1.6rem;display:grid;place-items:center;margin:auto}
.side{max-height:78vh;overflow:auto}
.side input{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);margin:12px 0}
.grp{margin-top:14px}.grp h4{font-size:1rem;margin-bottom:6px;display:flex;justify-content:space-between}
.les{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:right;padding:11px 14px;margin-bottom:6px;border-radius:13px;background:var(--bg);border:1px solid transparent}
.les:hover{border-color:var(--ac)}.les.on{border-color:var(--ac);background:var(--glow)}
.les small{background:var(--card);padding:1px 10px;border-radius:99px;color:var(--mut)}
.dn{color:var(--ok);font-weight:700}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
/* quiz */
.qh{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.tm{font-size:1.3rem;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.q{font-size:1.35rem;margin:18px 0}
.opts{display:grid;gap:12px}
.opt{display:flex;gap:14px;align-items:center;text-align:right;padding:14px 18px;border-radius:15px;background:var(--bg);border:1px solid var(--line);font-size:1.05rem}
.opt i{font-style:normal;width:32px;height:32px;border-radius:50%;background:rgba(242,182,50,.18);color:var(--gold);display:grid;place-items:center;font-weight:700}
.opt.sel{border-color:var(--ac);background:var(--glow)}.opt.right{border-color:var(--ok);background:rgba(25,207,147,.12)}.opt.wrong{border-color:var(--bad);background:rgba(240,80,110,.12)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.dot{width:34px;height:34px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:.9rem}
.dot.a{background:var(--ac);color:#fff;border-color:var(--ac)}.dot.f{outline:2px solid var(--gold)}.dot.c{box-shadow:0 0 0 2px var(--tx)}
.score{text-align:center;padding:20px}.score b{font-size:3.6rem;color:var(--ac);display:block;line-height:1.2}
.rv{padding:14px 0;border-bottom:1px solid var(--line)}
@media(max-width:900px){.cl{grid-template-columns:1fr}.g3{grid-template-columns:1fr}.side{max-height:none}}

.qcard{position:relative;background:#fff;color:#0c1b2e;border-radius:16px;min-height:190px;padding:22px 26px 60px;margin:6px 0 18px}
.qcard canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:none;border-radius:16px;z-index:2}
.qcard canvas.on{pointer-events:auto;cursor:crosshair}
.qcard img{max-width:100%;display:block;margin:0 auto 12px;border-radius:8px}
.qcard p{font-size:1.35rem;font-weight:700;color:#0b5fa8}
.pen{position:absolute;bottom:12px;left:12px;z-index:3;width:42px;height:42px;border-radius:50%;background:#1c2b57;color:#fff;font-size:1.1rem}
.pen.act{background:var(--ac)}.pen.clr{left:62px;background:var(--bad)}
.fp{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px}
.fi{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:right;padding:10px 14px;border-radius:12px;background:var(--bg);border:1px solid transparent;margin-bottom:6px}
.fi.in{border-color:var(--line)}
.fm label{display:block;margin:12px 0 4px;color:var(--mut);font-size:.95rem}
.fm input:not([type=file]),.fm textarea,.fm select{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
.fm input[type=file]{width:100%;padding:8px}
.g2f{grid-template-columns:1fr 1fr}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,30px);background:var(--ac);color:#fff;padding:10px 22px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.show{opacity:1;transform:translate(-50%,0)}
.player video{width:100%;height:100%;background:#000}
@media(max-width:900px){.g2f{grid-template-columns:1fr}}

.login input{margin:8px 0}
.er{color:var(--bad);min-height:22px;font-size:.95rem}
.lnk{background:none;color:var(--ac);margin-top:12px;text-decoration:underline}
a.fi{color:inherit;text-decoration:none}
button:disabled{opacity:.5;cursor:default}

/* مظهر موحّد مع الصفحة الرئيسية */
[hidden]{display:none!important}
:root{--onac:#fff}
body{background:radial-gradient(900px 520px at 85% -8%,rgba(24,164,242,.14),transparent 70%),radial-gradient(700px 420px at 8% 30%,rgba(242,182,50,.06),transparent 70%),var(--bg);background-attachment:fixed}

.top{top:10px;margin:10px 16px 0;border-radius:20px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 82%,transparent);backdrop-filter:blur(14px)}
.top .wrap{max-width:1180px}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--onac);box-shadow:0 8px 24px var(--glow)}
.btn.ok{background:var(--ok);color:#fff}
.card{border-radius:24px}
.course:nth-child(1) .thumb,.cc .th{background:linear-gradient(135deg,#0d6fb8,#1aa7f4)}
.step::before,.play,.dot.a,#toast{color:var(--onac)}

.inp{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);min-width:200px}
.g4{grid-template-columns:repeat(4,1fr)}
.chip2{padding:4px 14px;border-radius:99px;border:1px solid var(--line);margin:4px 0}
.chip2.ok{border-color:var(--ok);background:rgba(25,207,147,.14)}
.qi2{max-width:100%;border-radius:10px;background:#fff;margin:8px 0;display:block}
.ex{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--tx)}
.player iframe{width:100%;height:100%;border:0}
#nv{flex-wrap:wrap;justify-content:flex-end}
details summary{cursor:pointer;color:var(--ac)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}}

.login{position:relative;max-width:440px;margin:56px auto;padding:34px 28px;text-align:center;border:1px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--ac),transparent 55%,var(--gold)) border-box;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.login .lg{width:64px;height:64px;border-radius:18px;margin:0 auto 12px;box-shadow:0 10px 30px var(--glow);animation:bob 4s ease-in-out infinite}
.login input:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--glow);outline:0}
.ver{margin-top:14px;font-size:.78rem;color:var(--mut)}
#bgd{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}

/* ========= نوافذ منبثقة ========= */
function modal({icon='ℹ️',html='',ok='حسناً',cancel=null,wide=false}){
  return new Promise(res=>{
    const bg=document.createElement('div');bg.className='modal-bg';
    bg.innerHTML=`<div class="modal-box${wide?' wide':''}" role="dialog" aria-modal="true"><div class="mi">${icon}</div><div class="mb">${html}</div><div class="row mbtn">${cancel?`<button class="btn g" data-r="0">${cancel}</button>`:''}<button class="btn" data-r="1">${ok}</button></div></div>`;
    const done=v=>{bg.remove();res(v)};
    bg.onclick=e=>{if(e.target===bg)done(false)};
    bg.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>done(b.dataset.r==='1'));
    bg.querySelectorAll('.mb a').forEach(a=>a.addEventListener('click',()=>done(true)));
    document.body.append(bg);bg.querySelector('[data-r="1"]').focus();
  });
}

const svg=b=>`<svg viewBox="0 0 70 44" width="70" height="44" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">${b}</svg>`;
const FR=(a,b)=>`<span class="fr"><i>${a}</i><b>${b}</b></span>`;
const FC=(t,eq,fig)=>`<div class="fcard">${fig?`<div class="ffig">${svg(fig)}</div>`:''}<b>${t}</b><div class="feq">${eq}</div></div>`;
function formulasHtml(){
  const area=[
    FC('مساحة المربع','الضلع × الضلع = الضلع²','<rect x="18" y="5" width="34" height="34"/>'),
    FC('مساحة المستطيل','الطول × العرض','<rect x="6" y="10" width="58" height="28"/>'),
    FC('مساحة المثلث',`${FR('1','2')} × القاعدة × الارتفاع`,'<path d="M5 40 L35 6 L65 40 Z"/><path d="M35 6 V40" stroke-dasharray="3 3" opacity=".6"/>'),
    FC('مساحة متوازي الأضلاع','القاعدة × الارتفاع','<path d="M12 40 L28 8 L64 8 L48 40 Z"/>'),
    FC('مساحة المعين',`${FR('1','2')} × القطر الأول × القطر الثاني`,'<path d="M35 4 L64 22 L35 40 L6 22 Z"/><path d="M6 22 H64 M35 4 V40" stroke-dasharray="3 3" opacity=".6"/>'),
    FC('مساحة شبه المنحرف',`${FR('1','2')} × (القاعدة 1 + القاعدة 2) × الارتفاع`,'<path d="M4 40 L20 8 L50 8 L66 40 Z"/>'),
    FC('مساحة الدائرة','π × نق²','<circle cx="35" cy="22" r="18"/><path d="M35 22 H53"/>')
  ].join('');
  const peri=[
    FC('محيط المربع','4 × الضلع','<rect x="18" y="5" width="34" height="34"/>'),
    FC('محيط المستطيل','2 × (الطول + العرض)','<rect x="6" y="10" width="58" height="28"/>'),
    FC('محيط المعين','4 × الضلع','<path d="M35 4 L64 22 L35 40 L6 22 Z"/>'),
    FC('محيط المثلث / المضلع','مجموع أطوال الأضلاع','<path d="M35 4 L64 16 L56 40 L14 40 L6 16 Z"/>'),
    FC('محيط الدائرة','2 × π × نق','<circle cx="35" cy="22" r="18"/>'),
    FC('الحجوم','المكعب = الضلع³<br>متوازي المستطيلات = الطول × العرض × الارتفاع<br>الأسطوانة = π × نق² × الارتفاع')
  ].join('');
  const geo=[
    FC('فيثاغورس (مثلث قائم)','الوتر² = الضلع الأول² + الضلع الثاني²'),
    FC('مجموع الزوايا','المثلث = 180° ، الرباعي = 360°<br>المضلع ذو ن ضلع = (ن − 2) × 180°'),
    FC('مثلثات خاصة','30° ‑ 60° ‑ 90° : الأضلاع 1 : √3 : 2<br>قائم متساوي الساقين : 1 : 1 : √2'),
    FC('زوايا متتامة ومتكاملة','المتتامتان مجموعهما 90°<br>المتكاملتان مجموعهما 180°')
  ].join('');
  const cnt=[
    FC('قانون التباديل',`ل(ن ، ر) = ${FR('ن !','(ن − ر) !')}`),
    FC('قانون التوافيق',`ق(ن ، ر) = ${FR('ن !','(ن − ر) ! × ر !')}`),
    FC('عدد المصافحات',`${FR('ن (ن − 1)','2')}`),
    FC('مجموع الأعداد من 1 إلى ن',`${FR('ن (ن + 1)','2')}`)
  ].join('');
  const seq=[
    FC('الحد النوني (حسابية)','ح<sub>ن</sub> = ح<sub>1</sub> + (ن − 1) × الأساس'),
    FC('مجموع متتابعة حسابية',`${FR('ن','2')} × (الأول + الأخير)`),
    FC('الحد النوني (هندسية)','ح<sub>ن</sub> = ح<sub>1</sub> × ر<sup>ن − 1</sup>')
  ].join('');
  const alg=[
    FC('النسبة المئوية',`${FR('الجزء','الكل')} × 100`),
    FC('نسبة التغير',`${FR('الجديد − القديم','القديم')} × 100`),
    FC('المتوسط الحسابي',`${FR('مجموع القيم','عددها')}`),
    FC('السرعة',`${FR('المسافة','الزمن')}`),
    FC('الأسس','أ<sup>م</sup> × أ<sup>ن</sup> = أ<sup>م+ن</sup><br>(أ<sup>م</sup>)<sup>ن</sup> = أ<sup>م×ن</sup> ، أ<sup>0</sup> = 1'),
    FC('متطابقات','(أ + ب)² = أ² + 2أب + ب²<br>(أ − ب)² = أ² − 2أب + ب²<br>أ² − ب² = (أ − ب)(أ + ب)')
  ].join('');
  return`<h3 style="margin-bottom:14px">القوانين الرياضية</h3><div class="fgrid">
   <div class="fsec"><h4>المساحات</h4>${area}</div>
   <div class="fsec"><h4>المحيطات والحجوم</h4>${peri}</div>
   <div class="fsec"><h4>الهندسة</h4>${geo}<h4 style="margin-top:18px">التباديل والتوافيق</h4>${cnt}</div>
   <div class="fsec"><h4>المتتابعات</h4>${seq}<h4 style="margin-top:18px">الحساب والجبر</h4>${alg}</div></div>`;
}

const SEC_PER_Q=60;
const fmtDur=s=>`${Math.floor(s/60)} د ${s%60} ث`;
function quizRoute(h){
  const[,id,mode]=h.split('/');
  let it=allItems().find(x=>x.id===id);
  if(!it){
    for(const k of Object.keys(COURSES)){
      it=COURSES[k].groups.flatMap(g=>g.items).find(x=>x.id===id);
      if(it)break;
    }
  }
  if(!it)return location.hash='#/course';
  startQuiz(it,getQs(id),mode==='train'?'train':'exam');
}
function startQuiz(it,qs,mode){
  if(!qs.length)return toast('لا توجد أسئلة');
  const n=qs.length;
  Q={it,qs,mode,i:0,ans:Array(n).fill(null),flag:Array(n).fill(false),chk:Array(n).fill(false),left:SEC_PER_Q,fs:1,boards:{},fo:false,t0:Date.now()};
  clearInterval(timer);
  if(mode==='exam')timer=setInterval(tick,1000);
  qdraw();
}
function closeLayers(){document.querySelectorAll('.wb,.modal-bg').forEach(x=>x.remove())}
function tick(){
  Q.left--;
  const t=$('#tmr'),w=$('#wtm'),b=$('#qtbar');
  if(t)t.textContent=fmt(Math.max(0,Q.left));
  if(w)w.textContent=fmt(Math.max(0,Q.left));
  if(b)b.style.width=Math.max(0,Q.left/SEC_PER_Q*100)+'%';
  if(Q.left<=0){closeLayers();if(Q.i<Q.qs.length-1){Q.i++;Q.left=SEC_PER_Q;qdraw()}else finish()}
}
async function goNext(){
  const idx=Q.i;
  if(Q.mode==='exam'&&Q.ans[idx]===null){
    const ok=await modal({icon:'❓',html:'لم تقم بحلّ هذا السؤال، هل تريد المتابعة؟',ok:'تأكيد',cancel:'إلغاء'});
    if(!ok||Q.i!==idx)return;
  }
  if(Q.i>=Q.qs.length-1)return askFinish();
  Q.i++;Q.left=SEC_PER_Q;qdraw();
}
async function askFinish(){
  const un=Q.ans.filter(a=>a===null).length;
  const ok=await modal({icon:'❓',html:un?`لديك <b>${un}</b> سؤال غير محلول. هل تريد إنهاء الاختبار؟`:'هل تريد إنهاء الاختبار وعرض النتيجة؟',ok:'تأكيد',cancel:'إلغاء'});
  if(ok)finish();
}

/* ========= السبورة الذكية ========= */
const WB_COL=['#ff8a3d','#e7a21b','#ff7b7b','#e5e7eb','#f472b6','#c084fc','#3b9cff','#22c55e'];
const WB_W={XL:12,L:7,M:4,S:2},WB_S={XL:48,L:34,M:24,S:16};
function textCard(q){
  const c=document.createElement('canvas');c.width=900;let x=c.getContext('2d');
  const F=n=>`700 ${n}px Readex Pro,Tahoma,sans-serif`,lines=[];
  x.font=F(34);
  const wrap=(t,max)=>{const out=[];let cur='';for(const w of t.split(/\s+/)){const nx=cur?cur+' '+w:w;if(x.measureText(nx).width>max&&cur){out.push(cur);cur=w}else cur=nx}if(cur)out.push(cur);return out};
  wrap(q.q||'',820).forEach(l=>lines.push([l,34,'#0b5fa8']));
  q.o.forEach((o,k)=>{if(o)lines.push([L[k]+') '+o,30,'#222'])});
  c.height=Math.max(160,lines.length*50+60);x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.direction='rtl';x.textAlign='right';
  lines.forEach((l,i)=>{x.font=F(l[1]);x.fillStyle=l[2];x.fillText(l[0],c.width-40,60+i*50)});
  return c;
}
function wbBox(o){
  if(o.t==='pen'){const xs=o.p.map(p=>p[0]),ys=o.p.map(p=>p[1]);return[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]}
  if(o.t==='txt'){const w=o.txt.length*o.s*.6;return[o.x-w,o.y-o.s,o.x,o.y+4]}
  return[Math.min(o.x1,o.x2),Math.min(o.y1,o.y2),Math.max(o.x1,o.x2),Math.max(o.y1,o.y2)];
}
function wbHit(o,x,y,tol){
  const seg=(x1,y1,x2,y2)=>{const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;let t=l?((x-x1)*dx+(y-y1)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(x-(x1+t*dx),y-(y1+t*dy))};
  if(o.t==='pen'){if(o.p.length===1)return Math.hypot(x-o.p[0][0],y-o.p[0][1])<=tol+o.w;for(let i=1;i<o.p.length;i++)if(seg(o.p[i-1][0],o.p[i-1][1],o.p[i][0],o.p[i][1])<=tol+o.w/2)return true;return false}
  if(o.t==='line'||o.t==='arr')return seg(o.x1,o.y1,o.x2,o.y2)<=tol+o.w/2;
  const b=wbBox(o);return x>=b[0]-tol&&x<=b[2]+tol&&y>=b[1]-tol&&y<=b[3]+tol;
}
function wbMove(o,dx,dy){
  if(o.t==='pen')o.p=o.p.map(p=>[p[0]+dx,p[1]+dy]);
  else if(o.t==='txt'){o.x+=dx;o.y+=dy}
  else{o.x1+=dx;o.x2+=dx;o.y1+=dy;o.y2+=dy}
}
function wbDraw(ctx,o,sel){
  ctx.save();ctx.strokeStyle=o.c;ctx.fillStyle=o.c;ctx.lineWidth=o.w||3;ctx.lineCap='round';ctx.lineJoin='round';
  if(o.t==='pen'){ctx.beginPath();o.p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));if(o.p.length===1)ctx.lineTo(o.p[0][0]+.01,o.p[0][1]);ctx.stroke()}
  else if(o.t==='line'||o.t==='arr'){ctx.beginPath();ctx.moveTo(o.x1,o.y1);ctx.lineTo(o.x2,o.y2);ctx.stroke();
    if(o.t==='arr'){const a=Math.atan2(o.y2-o.y1,o.x2-o.x1),h=10+o.w*2;ctx.beginPath();ctx.moveTo(o.x2,o.y2);ctx.lineTo(o.x2-h*Math.cos(a-.45),o.y2-h*Math.sin(a-.45));ctx.moveTo(o.x2,o.y2);ctx.lineTo(o.x2-h*Math.cos(a+.45),o.y2-h*Math.sin(a+.45));ctx.stroke()}}
  else if(o.t==='rect')ctx.strokeRect(Math.min(o.x1,o.x2),Math.min(o.y1,o.y2),Math.abs(o.x2-o.x1),Math.abs(o.y2-o.y1));
  else if(o.t==='ell'){ctx.beginPath();ctx.ellipse((o.x1+o.x2)/2,(o.y1+o.y2)/2,Math.abs(o.x2-o.x1)/2,Math.abs(o.y2-o.y1)/2,0,0,Math.PI*2);ctx.stroke()}
  else if(o.t==='dia'){const cx=(o.x1+o.x2)/2,cy=(o.y1+o.y2)/2;ctx.beginPath();ctx.moveTo(cx,o.y1);ctx.lineTo(o.x2,cy);ctx.lineTo(cx,o.y2);ctx.lineTo(o.x1,cy);ctx.closePath();ctx.stroke()}
  else if(o.t==='txt'){ctx.font=`700 ${o.s}px Readex Pro,Tahoma,sans-serif`;ctx.textAlign='right';ctx.direction='rtl';ctx.fillText(o.txt,o.x,o.y)}
  if(sel){const b=wbBox(o);ctx.strokeStyle='#18a4f2';ctx.lineWidth=1.5;ctx.setLineDash([6,4]);ctx.strokeRect(b[0]-6,b[1]-6,b[2]-b[0]+12,b[3]-b[1]+12)}
  ctx.restore();
}
function openBoard(){
  const q=Q.qs[Q.i],B=Q.boards[Q.i]=Q.boards[Q.i]||{objs:[],undo:[],redo:[],view:{x:0,y:0,z:1},init:false};
  const ov=document.createElement('div');ov.className='wb';
  ov.innerHTML=`<div class="wbh"><div class="row"><button class="ib" id="wx" aria-label="إغلاق">✕</button>${Q.mode==='exam'?`<span class="wbt">⏱ <b id="wtm">${fmt(Math.max(0,Q.left))}</b></span>`:''}<button class="btn g sm" id="wclr">🗑 مسح</button><button class="btn sm" id="wq">🖼 السؤال</button></div><div><b>السبورة</b> <span class="mut sm">ميزة إضافية من المنصة · غير متاحة في الاختبار الفعلي</span></div></div>
  <div class="wbs"><canvas id="wbc"></canvas>
   <div class="wbp"><div class="wbcols">${WB_COL.map(c=>`<button class="wbc" data-c="${c}" style="background:${c}" aria-label="لون"></button>`).join('')}</div><div class="row">${Object.keys(WB_W).map(k=>`<button class="wbz" data-w="${k}">${k}</button>`).join('')}</div></div>
   <div class="wbu"><button class="ib" id="wun" aria-label="تراجع">↶</button><button class="ib" id="wre" aria-label="إعادة">↷</button></div>
   <div class="wbzm"><button class="ib" id="zin" aria-label="تكبير">+</button><b id="zv">100%</b><button class="ib" id="zout" aria-label="تصغير">−</button></div>
   <div class="wbtools">${[['sel','↖','تحديد وتحريك'],['hand','✋','تحريك اللوحة'],['pen','✏','قلم'],['era','⌫','ممحاة'],['arr','➚','سهم'],['line','╱','خط'],['txt','T','نص'],['rect','▭','مستطيل'],['ell','◯','دائرة'],['dia','◇','معين']].map(t=>`<button class="ib wt" data-t="${t[0]}" title="${t[2]}" aria-label="${t[2]}">${t[1]}</button>`).join('')}</div></div>`;
  document.body.append(ov);
  const stage=ov.querySelector('.wbs'),cv=ov.querySelector('#wbc'),ctx=cv.getContext('2d'),v=B.view;
  let tool='pen',col=WB_COL[6],wk='M',showQ=true,bg=null,bw=760,bh=420,sel=-1,tmp=null,drag=null,dpr=1;
  const snap=()=>{B.undo.push(JSON.stringify(B.objs));if(B.undo.length>60)B.undo.shift();B.redo=[]};
  const draw=()=>{
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
    ctx.setTransform(dpr*v.z,0,0,dpr*v.z,dpr*v.x,dpr*v.y);
    if(showQ&&bg)ctx.drawImage(bg,-bw/2,-bh/2,bw,bh);
    B.objs.forEach((o,i)=>wbDraw(ctx,o,i===sel));
    if(tmp)wbDraw(ctx,tmp,false);
    ov.querySelector('#zv').textContent=Math.round(v.z*100)+'%';
    ov.querySelector('#wun').disabled=!B.undo.length;ov.querySelector('#wre').disabled=!B.redo.length;
  };
  const fit=()=>{const r=stage.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);cv.width=r.width*dpr;cv.height=r.height*dpr;
    if(!B.init){v.x=r.width/2;v.y=r.height/2-30;v.z=Math.min(1,r.width/820);B.init=true}draw()};
  const ui=()=>{
    ov.querySelectorAll('.wt').forEach(b=>b.classList.toggle('on',b.dataset.t===tool));
    ov.querySelectorAll('.wbc').forEach(b=>b.classList.toggle('on',b.dataset.c===col));
    ov.querySelectorAll('.wbz').forEach(b=>b.classList.toggle('on',b.dataset.w===wk));
    cv.style.cursor=tool==='hand'?'grab':tool==='sel'?'default':'crosshair';
  };
  const setBg=()=>{const w=bg.width||bg.naturalWidth,h=bg.height||bg.naturalHeight;bw=760;bh=h*760/w};
  if(q.img){qimg(q.id).then(d=>{if(!d)return;const im=new Image();im.onload=()=>{bg=im;setBg();draw()};im.src=d})}else{bg=textCard(q);setBg()}
  const pos=e=>{const r=cv.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top;return{sx,sy,x:(sx-v.x)/v.z,y:(sy-v.y)/v.z}};
  const hitIdx=(x,y)=>{for(let i=B.objs.length-1;i>=0;i--)if(wbHit(B.objs[i],x,y,8/v.z))return i;return -1};
  const zoomAt=(px,py,f)=>{const nz=Math.max(.2,Math.min(5,v.z*f));v.x=px-(px-v.x)*(nz/v.z);v.y=py-(py-v.y)*(nz/v.z);v.z=nz;draw()};
  cv.onpointerdown=e=>{
    cv.setPointerCapture(e.pointerId);const p=pos(e);drag={sx:p.sx,sy:p.sy,x:p.x,y:p.y,vx:v.x,vy:v.y};
    if(tool==='pen')tmp={t:'pen',c:col,w:WB_W[wk],p:[[p.x,p.y]]};
    else if(['line','arr','rect','ell','dia'].includes(tool))tmp={t:tool,c:col,w:WB_W[wk],x1:p.x,y1:p.y,x2:p.x,y2:p.y};
    else if(tool==='txt'){drag=null;const t=prompt('اكتب النص:');if(t&&t.trim()){snap();B.objs.push({t:'txt',c:col,s:WB_S[wk],x:p.x,y:p.y,txt:t.trim()})}draw();return}
    else if(tool==='era'){snap();B.objs=B.objs.filter(o=>!wbHit(o,p.x,p.y,10/v.z))}
    else if(tool==='sel'){sel=hitIdx(p.x,p.y);if(sel>=0)snap()}
    draw();
  };
  cv.onpointermove=e=>{
    if(!drag)return;const p=pos(e);
    if(tool==='hand'){v.x=drag.vx+(p.sx-drag.sx);v.y=drag.vy+(p.sy-drag.sy)}
    else if(tool==='pen'&&tmp)tmp.p.push([p.x,p.y]);
    else if(tmp){tmp.x2=p.x;tmp.y2=p.y}
    else if(tool==='era')B.objs=B.objs.filter(o=>!wbHit(o,p.x,p.y,10/v.z));
    else if(tool==='sel'&&sel>=0){wbMove(B.objs[sel],p.x-drag.x,p.y-drag.y);drag.x=p.x;drag.y=p.y}
    draw();
  };
  cv.onpointerup=cv.onpointercancel=()=>{if(tmp){snap();B.objs.push(tmp);tmp=null}drag=null;draw()};
  cv.onwheel=e=>{e.preventDefault();const p=pos(e);zoomAt(p.sx,p.sy,e.deltaY<0?1.1:1/1.1)};
  ov.querySelectorAll('.wt').forEach(b=>b.onclick=()=>{tool=b.dataset.t;sel=-1;ui();draw()});
  ov.querySelectorAll('.wbc').forEach(b=>b.onclick=()=>{col=b.dataset.c;ui()});
  ov.querySelectorAll('.wbz').forEach(b=>b.onclick=()=>{wk=b.dataset.w;ui()});
  ov.querySelector('#wun').onclick=()=>{if(!B.undo.length)return;B.redo.push(JSON.stringify(B.objs));B.objs=JSON.parse(B.undo.pop());sel=-1;draw()};
  ov.querySelector('#wre').onclick=()=>{if(!B.redo.length)return;B.undo.push(JSON.stringify(B.objs));B.objs=JSON.parse(B.redo.pop());sel=-1;draw()};
  ov.querySelector('#wclr').onclick=()=>{if(B.objs.length&&confirm('مسح كل الكتابة على هذه السبورة؟')){snap();B.objs=[];sel=-1;draw()}};
  ov.querySelector('#wq').onclick=e=>{showQ=!showQ;e.currentTarget.classList.toggle('g',!showQ);draw()};
  ov.querySelector('#zin').onclick=()=>zoomAt(cv.clientWidth/2,cv.clientHeight/2,1.2);
  ov.querySelector('#zout').onclick=()=>zoomAt(cv.clientWidth/2,cv.clientHeight/2,1/1.2);
  const kd=e=>{if(e.key==='Escape')close();else if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();ov.querySelector('#wun').click()}};
  const close=()=>{ov.remove();removeEventListener('keydown',kd);removeEventListener('resize',fit);const pn=$('#pn');if(pn)pn.classList.toggle('has',B.objs.length>0)};
  addEventListener('keydown',kd);addEventListener('resize',fit);
  ov.querySelector('#wx').onclick=close;
  ui();fit();
}

/* ========= المجلدات ========= */
function qHtml(q,showAns){
  return`${q.img?`<img class="qi2" data-q="${q.id}" alt="">`:''}${q.q?`<p>${esc(q.q)}</p>`:''}<div class="row" style="flex-wrap:wrap">${q.o.map((o,k)=>`<span class="chip2 ${showAns&&k===q.a?'ok':''}">${L[k]} ${esc(o)}</span>`).join('')}</div>${showAns?`<p class="mut" style="margin-top:6px">الإجابة: ${L[q.a]}${q.e?' — '+esc(q.e):''}</p>`:''}`;
}
function folders(){
  const F=S.folders,ks=Object.keys(F);if(!ks.includes(fsel)){fsel=ks[0]||'';fpage=0}
  const refs=(F[fsel]||[]).map(r=>({r,q:findQ(r)})).filter(x=>x.q),per=10,pages=Math.max(1,Math.ceil(refs.length/per));
  fpage=Math.min(fpage,pages-1);
  const total=ks.reduce((a,k)=>a+F[k].length,0),view=refs.slice(fpage*per,fpage*per+per);
  app.innerHTML=`<h2>📁 إدارة المجلدات</h2><p class="mut">اختر المجلد لعرض الأسئلة المحفوظة، وراجعها أو ابدأ اختباراً منها.</p><br>
  ${ks.length?`<div class="card"><div class="row" style="flex-wrap:wrap"><select class="inp" id="fs">${ks.map(k=>`<option ${k===fsel?'selected':''}>${esc(k)}</option>`).join('')}</select>
   <button class="btn" id="fq" ${refs.length?'':'disabled'}>ابدأ الاختبار ▶</button><button class="btn g" id="fd">حذف المجلد</button></div></div><br>
  <div class="grid g4"><div class="card stat"><b>${total}</b>إجمالي الأسئلة</div><div class="card stat"><b>${ks.length}</b>المجلدات</div><div class="card stat"><b>${fpage+1}</b>الصفحة الحالية</div><div class="card stat"><b>${pages}</b>إجمالي الصفحات</div></div><br>
  <div class="card"><div class="qh"><h3>الأسئلة المعروضة (${refs.length})</h3><label class="row"><input type="checkbox" id="sa" ${fshow?'checked':''}> إظهار الإجابات</label></div>
  ${view.map(x=>`<div class="rv"><div class="qh"><span class="mut">${esc(tname(x.q.tid))}</span><button class="ib" data-rm="${esc(x.r)}" aria-label="إزالة">✕</button></div>${qHtml(x.q,fshow)}</div>`).join('')||'<p class="mut">المجلد فارغ</p>'}
  <div class="row" style="justify-content:center;margin-top:14px"><button class="btn g" id="pp" ${fpage?'':'disabled'}>السابق</button><button class="btn g" id="np" ${fpage<pages-1?'':'disabled'}>التالي</button></div></div>`:
  '<div class="card score"><p class="mut">لا توجد مجلدات بعد. أضف سؤالاً لمجلد أثناء الاختبار.</p></div>'}`;
  if(!ks.length)return;
  $('#fs').onchange=e=>{fsel=e.target.value;fpage=0;folders()};
  $('#sa').onchange=e=>{fshow=e.target.checked;folders()};
  $('#pp').onclick=()=>{fpage--;folders()};$('#np').onclick=()=>{fpage++;folders()};
  $('#fd').onclick=()=>{if(confirm('حذف المجلد؟')){delete S.folders[fsel];saveUser({folders:S.folders});folders()}};
  $('#fq').onclick=()=>startQuiz({id:'folder',t:'مجلد: '+fsel},refs.map(x=>x.q),'train');
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{S.folders[fsel]=S.folders[fsel].filter(x=>x!==b.dataset.rm);saveUser({folders:S.folders});folders()});
  fillImgs();
}

/* ========= البحث عن الأسئلة ========= */
function search(){
  app.innerHTML=`<h2>🔍 البحث عن الأسئلة</h2><p class="mut">ابحث بكلمة من نص السؤال أو خياراته أو الكلمات المفتاحية.</p><br>
  <input class="inp" id="sq" placeholder="اكتب كلمة مفتاحية..." style="width:100%"><div id="sres" style="margin-top:16px"></div>`;
  const run=()=>{const t=$('#sq').value.trim();
    if(t.length<2){$('#sres').innerHTML='<p class="mut">اكتب حرفين على الأقل</p>';return}
    const rs=allQs().filter(q=>[q.q,q.k,q.e,...q.o].join(' ').includes(t)).slice(0,30);
    $('#sres').innerHTML=rs.length?rs.map(q=>`<div class="card" style="margin-bottom:12px"><span class="mut">${esc(tname(q.tid))}</span>${qHtml(q,false)}<details style="margin-top:8px"><summary>إظهار الإجابة</summary><p><b>${L[q.a]}</b>${q.o[q.a]?' — '+esc(q.o[q.a]):''}</p>${q.e?`<p class="mut">${esc(q.e)}</p>`:''}</details></div>`).join(''):'<p class="mut">لا توجد نتائج</p>';
    fillImgs()};
  $('#sq').oninput=run;run();
}

    };
    $('#fadd').onclick=async()=>{
      const n=$('#fn').value.trim(),u=$('#fu').value.trim();if(!n||!/^https?:\/\//.test(u))return toast('أدخل اسماً ورابطاً صحيحاً');
      mm(lid()).files.push({name:n,url:u});await saveM(lid());$('#fn').value=$('#fu').value='';toast('أُضيف الملف ✓');ml();
    };

    // قائمة الأسئلة الحالية
    const cl=()=>{
      const t=$('#lt').value,qs=getQs(t);
      $('#cl').innerHTML=qs.length?qs.map((q,i)=>`<div class="fi in"><span>${i+1}. ${esc(q.q)||'🖼 سؤال مصوّر'} — ${L[q.a]}</span><button class="ib" data-dq="${q.id}">✕</button></div>`).join(''):'<p class="mut">لا توجد أسئلة في هذا الاختبار</p>';
      $('#cl').querySelectorAll('[data-dq]').forEach(b=>b.onclick=async()=>{
        if(!confirm('حذف السؤال؟'))return;
        const q=S.tests[t].find(x=>x.id===b.dataset.dq);
        S.tests[t]=S.tests[t].filter(x=>x.id!==q.id);
        try{await setDoc(doc(db,'tests',t),{qs:S.tests[t]});if(q.img)await deleteDoc(doc(db,'qimg',q.id))}catch(e){toast('تعذر الحذف')}
        cl();
      });
    };
    $('#lt').onchange=cl;cl();

    // رفع جماعي
    $('#badd').onclick=async()=>{
      const t=$('#bt').value,fs=[...$('#bi').files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
      const MAP={'أ':0,'ا':0,'إ':0,'ب':1,'ج':2,'د':3,a:0,b:1,c:2,d:3},key=[...$('#bk').value.toLowerCase().replace(/[\s,،\-–]/g,'')].map(c=>MAP[c]);
      if(!fs.length)return toast('اختر الصور أولاً');
      if(key.length!==fs.length||key.some(x=>x===undefined))return toast(`عدد الإجابات (${key.length}) لا يطابق عدد الصور (${fs.length}) أو فيها رمز غير مفهوم`);
      try{
        const add=[];
        for(let i=0;i<fs.length;i++){
          toast(`جارٍ الرفع ${i+1}/${fs.length}`);
          const id='q'+uid()+i;
          await setDoc(doc(db,'qimg',id),{d:await compress(fs[i])});
          add.push({id,q:'',o:['','','',''],a:key[i],e:'',v:'',k:'',img:true});
        }
        S.tests[t]=[...(S.tests[t]||[]),...add];
        await setDoc(doc(db,'tests',t),{qs:S.tests[t]});
        toast('تم رفع '+fs.length+' سؤال ✓');
        cl();
      }catch(x){console.error(x);toast('تعذر الرفع')}
    };

    // استيراد JSON
    $('#jadd').onclick=async()=>{
      const f=$('#jf').files[0],t=$('#jt').value;if(!f)return toast('اختر الملف');
      try{
        const arr=JSON.parse(await f.text());
        if(!Array.isArray(arr)||!arr.length)throw new Error('الملف لا يحوي قائمة أسئلة');
        const add=arr.map((x,i)=>{
          if(!x.q||!Array.isArray(x.o)||x.o.length!==4||![0,1,2,3].includes(x.a))throw new Error('السؤال '+(i+1)+' غير مكتمل');
          return{id:'q'+uid()+i,q:String(x.q),o:x.o.map(String),a:x.a,e:String(x.e||''),v:'',k:String(x.k||''),img:false};
        });
        S.tests[t]=[...(S.tests[t]||[]),...add];
        await setDoc(doc(db,'tests',t),{qs:S.tests[t]});
        toast('تم استيراد '+add.length+' سؤال ✓');cl();
      }catch(x){toast(x instanceof SyntaxError?'ملف JSON غير صالح':x.message)}
    };

    // نتائج الطلاب
    getDocs(collectionGroup(db,'results')).then(s=>{
      const rows=s.docs.map(d=>d.data()).sort((a,b)=>(b.ts?.seconds||0)-(a.ts?.seconds||0)).slice(0,100);
      $('#rs').innerHTML=rows.length?`<table><tr><th>الطالب</th><th>الاختبار</th><th>النوع</th><th>النتيجة</th><th>التاريخ</th></tr>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.t)}</td><td>${x.m==='train'?'تدريب':'محاكي'}</td><td>${x.p}%</td><td>${esc(x.d)}</td></tr>`).join('')}</table>`:'<p class="mut">لا توجد نتائج بعد</p>';
    }).catch(e=>{$('#rs').innerHTML='<p class="er">تعذر تحميل النتائج — راجع قواعد Firestore</p>'});
  };

  renderAdminUI();
}

theme();
if(!ready){
  app.innerHTML=`<div class="card"><h2>🔧 الإعداد مطلوب</h2><p class="mut">افتح الملف وضع إعدادات مشروعك في <b>firebaseConfig</b> أعلى السكربت، ثم أعد التحميل.</p></div>`;
}else{
  app.innerHTML='<p class="mut" style="text-align:center;margin-top:80px">جارٍ التحميل...</p>';
  onAuthStateChanged(auth,async u=>{
    S.user=u;S.isAdmin=!!u&&u.uid===ADMIN_UID;
    if(u){await loadAll();applyAccent(S.accent)}
    S.pending='';route();
  });
